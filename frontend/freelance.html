<!-- Freelance Page -->
<div class="freelance-container">
    <div class="freelance-header">
        <div>
            <h2>💼 Freelance</h2>
            <p>Find work or hire talent</p>
        </div>
        <button class="post-job-btn" onclick="ALPHA.openPostJob()">+ Post Job</button>
    </div>

    <!-- Tabs -->
    <div class="freelance-tabs">
        <button class="freelance-tab active" data-tab="jobs">Jobs</button>
        <button class="freelance-tab" data-tab="freelancers">Freelancers</button>
        <button class="freelance-tab" data-tab="my-jobs">My Jobs</button>
    </div>

    <!-- Jobs List -->
    <div class="jobs-list" id="jobsList">
        <!-- Jobs loaded dynamically -->
    </div>
</div>
