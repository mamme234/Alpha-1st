<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALPHA</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Loading Screen -->
        <div id="loader" class="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">ALPHA</div>
        </div>

        <!-- Main Content -->
        <div id="main-content" style="display:none;">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <div class="user-avatar" id="userAvatar">
                        <img src="" alt="Avatar" id="avatarImg">
                    </div>
                    <div class="user-info">
                        <span class="username" id="username">User</span>
                        <span class="user-level" id="userLevel">Level 1</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="wallet-badge" id="walletBadge">
                        <span class="wallet-icon">💰</span>
                        <span class="wallet-amount" id="walletAmount">0.00</span>
                    </div>
                    <button class="notification-btn" id="notifBtn">
                        <span class="notif-icon">🔔</span>
                        <span class="notif-dot" id="notifDot"></span>
                    </button>
                </div>
            </header>

            <!-- Pages -->
            <div id="pages">
                <div class="page active" id="page-home"></div>
                <div class="page" id="page-earn"></div>
                <div class="page" id="page-create"></div>
                <div class="page" id="page-chat"></div>
                <div class="page" id="page-profile"></div>
                <div class="page" id="page-marketplace"></div>
                <div class="page" id="page-wallet"></div>
                <div class="page" id="page-referrals"></div>
                <div class="page" id="page-leaderboard"></div>
                <div class="page" id="page-rewards"></div>
                <div class="page" id="page-admin"></div>
            </div>

            <!-- Bottom Navigation -->
            <nav class="bottom-nav" id="bottomNav">
                <button class="nav-item active" data-page="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Home</span>
                </button>
                <button class="nav-item" data-page="earn">
                    <span class="nav-icon">💰</span>
                    <span class="nav-label">Earn</span>
                </button>
                <button class="nav-item create-btn" data-page="create">
                    <span class="nav-icon">➕</span>
                    <span class="nav-label">Create</span>
                </button>
                <button class="nav-item" data-page="chat">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">Chat</span>
                </button>
                <button class="nav-item" data-page="profile">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">Profile</span>
                </button>
            </nav>
        </div>
    </div>

    <script src="components.js"></script>
    <script src="main.js"></script>
</body>
  </html>
