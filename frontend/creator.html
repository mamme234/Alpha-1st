<!-- Creator Page Content -->
<div class="creator-container">
    <!-- Creator Stats -->
    <div class="creator-stats glass">
        <div class="creator-stat-item">
            <span class="creator-stat-value" id="creatorFollowers">0</span>
            <span class="creator-stat-label">Followers</span>
        </div>
        <div class="creator-stat-item">
            <span class="creator-stat-value" id="creatorViews">0</span>
            <span class="creator-stat-label">Views</span>
        </div>
        <div class="creator-stat-item">
            <span class="creator-stat-value" id="creatorEarnings">$0.00</span>
            <span class="creator-stat-label">Earnings</span>
        </div>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
        <div class="section-header">
            <h3>📤 Upload Content</h3>
        </div>
        <div class="upload-grid">
            <button class="upload-btn" data-type="video">
                <span class="upload-icon">🎥</span>
                <span>Video</span>
            </button>
            <button class="upload-btn" data-type="photo">
                <span class="upload-icon">📸</span>
                <span>Photo</span>
            </button>
            <button class="upload-btn" data-type="audio">
                <span class="upload-icon">🎵</span>
                <span>Audio</span>
            </button>
            <button class="upload-btn" data-type="document">
                <span class="upload-icon">📄</span>
                <span>Document</span>
            </button>
            <button class="upload-btn" data-type="course">
                <span class="upload-icon">📚</span>
                <span>Course</span>
            </button>
        </div>
    </div>

    <!-- Monetization -->
    <div class="monetization-section">
        <div class="section-header">
            <h3>💰 Monetization</h3>
        </div>
        <div class="monetization-grid">
            <div class="monetization-card glass">
                <span class="monetization-icon">💎</span>
                <h4>Paid Videos</h4>
                <span class="monetization-status" id="paidVideosStatus">0 active</span>
            </div>
            <div class="monetization-card glass">
                <span class="monetization-icon">📀</span>
                <h4>Premium Albums</h4>
                <span class="monetization-status" id="premiumAlbumsStatus">0 active</span>
            </div>
            <div class="monetization-card glass">
                <span class="monetization-icon">💝</span>
                <h4>Tips Received</h4>
                <span class="monetization-status" id="tipsReceived">$0.00</span>
            </div>
            <div class="monetization-card glass">
                <span class="monetization-icon">📅</span>
                <h4>Subscribers</h4>
                <span class="monetization-status" id="subscribersCount">0</span>
            </div>
        </div>
    </div>

    <!-- Creator Content -->
    <div class="creator-content">
        <div class="section-header">
            <h3>📦 Your Content</h3>
            <button class="manage-btn">Manage</button>
        </div>
        <div class="content-grid" id="creatorContentGrid">
            <!-- Content loaded dynamically -->
        </div>
    </div>
              </div>
