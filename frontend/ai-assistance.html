<!-- AI Assistant Page -->
<div class="ai-container">
    <div class="ai-header">
        <h2>🤖 AI Assistant</h2>
        <p>Powered by advanced AI</p>
    </div>

    <!-- Quick Actions -->
    <div class="ai-quick-actions">
        <button class="ai-action" data-action="generate">✨ Generate Text</button>
        <button class="ai-action" data-action="ideas">💡 Get Ideas</button>
        <button class="ai-action" data-action="email">📧 Write Email</button>
        <button class="ai-action" data-action="translate">🌐 Translate</button>
        <button class="ai-action" data-action="summary">📝 Summarize</button>
        <button class="ai-action" data-action="code">💻 Coding Help</button>
        <button class="ai-action" data-action="learn">📚 Learn</button>
        <button class="ai-action" data-action="chat">💬 Chat</button>
    </div>

    <!-- Chat Interface -->
    <div class="ai-chat">
        <div class="ai-messages" id="aiMessages">
            <div class="ai-message bot">
                <div class="message-bubble">
                    Hello! I'm your AI Assistant. How can I help you today?
                </div>
            </div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="aiInput" placeholder="Ask anything..." class="ai-input">
            <button class="ai-send-btn" id="aiSendBtn">Send</button>
        </div>
    </div>
  </div>
