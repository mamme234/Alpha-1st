<!-- Profile Page Content -->
<div class="profile-container">
    <!-- Profile Header -->
    <div class="profile-header glass">
        <div class="profile-avatar">
            <img src="" alt="Profile" id="profileAvatar">
            <button class="edit-avatar">📷</button>
        </div>
        <h2 id="profileUsername">User</h2>
        <p id="profileBio">Alpha member</p>
        <div class="profile-badges">
            <span class="badge" id="profileLevel">Level 1</span>
            <span class="badge premium" id="premiumBadge" style="display:none;">⭐ Premium</span>
        </div>
    </div>

    <!-- Profile Stats -->
    <div class="profile-stats">
        <div class="profile-stat">
            <span id="profileXP">0</span>
            <span>XP</span>
        </div>
        <div class="profile-stat">
            <span id="profileAchievements">0</span>
            <span>Achievements</span>
        </div>
        <div class="profile-stat">
            <span id="profileCountry">🌍</span>
            <span>Country</span>
        </div>
    </div>

    <!-- Settings -->
    <div class="settings-section">
        <div class="settings-item">
            <span>🔔 Notifications</span>
            <label class="toggle-switch">
                <input type="checkbox" id="notifToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-item">
            <span>🌙 Dark Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="darkModeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-item">
            <span>🔒 Privacy</span>
            <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item">
            <span>💎 Premium</span>
            <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item">
            <span>❓ Help & Support</span>
            <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item logout">
            <span>🚪 Logout</span>
            <span class="settings-arrow">›</span>
        </div>
    </div>
  </div>
