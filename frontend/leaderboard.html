<!-- Leaderboard Page Content -->
<div class="leaderboard-container">
    <!-- Tabs -->
    <div class="leaderboard-tabs">
        <button class="lb-tab active" data-tab="earners">Top Earners</button>
        <button class="lb-tab" data-tab="referrals">Top Referrals</button>
        <button class="lb-tab" data-tab="creators">Top Creators</button>
    </div>

    <!-- Time Filters -->
    <div class="time-filters">
        <button class="time-filter active" data-time="weekly">Weekly</button>
        <button class="time-filter" data-time="monthly">Monthly</button>
        <button class="time-filter" data-time="alltime">All Time</button>
    </div>

    <!-- Leaderboard List -->
    <div class="leaderboard-list" id="leaderboardList">
        <!-- Leaderboard items loaded dynamically -->
    </div>
</div>
