<!-- Marketplace Page -->
<div class="marketplace-container">
    <div class="marketplace-header">
        <h2>🛒 Marketplace</h2>
        <button class="sell-btn" onclick="ALPHA.loadPage('create')">+ Sell</button>
    </div>

    <!-- Categories -->
    <div class="categories-scroll">
        <button class="category-btn active" data-category="all">All</button>
        <button class="category-btn" data-category="prompts">🤖 AI Prompts</button>
        <button class="category-btn" data-category="websites">🌐 Websites</button>
        <button class="category-btn" data-category="bots">🤖 Bots</button>
        <button class="category-btn" data-category="code">💻 Source Code</button>
        <button class="category-btn" data-category="logos">🎨 Logos</button>
        <button class="category-btn" data-category="ui">🎨 UI Kits</button>
        <button class="category-btn" data-category="ebooks">📖 E-books</button>
        <button class="category-btn" data-category="courses">📚 Courses</button>
        <button class="category-btn" data-category="photos">📸 Photos</button>
        <button class="category-btn" data-category="videos">🎬 Videos</button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="marketplaceProducts">
        <!-- Products loaded dynamically -->
    </div>
</div>
