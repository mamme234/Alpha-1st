<!-- Marketplace Page Content -->
<div class="marketplace-container">
    <!-- Search & Filter -->
    <div class="marketplace-search">
        <input type="text" placeholder="Search products..." class="search-input" id="marketplaceSearch">
        <button class="filter-btn">🔍</button>
    </div>

    <!-- Categories -->
    <div class="categories-scroll">
        <button class="category-btn active" data-category="all">All</button>
        <button class="category-btn" data-category="business">💼 Business</button>
        <button class="category-btn" data-category="ai">🤖 AI</button>
        <button class="category-btn" data-category="education">📚 Education</button>
        <button class="category-btn" data-category="design">🎨 Design</button>
        <button class="category-btn" data-category="tech">💻 Technology</button>
        <button class="category-btn" data-category="entertainment">🎭 Entertainment</button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">
        <!-- Products loaded dynamically -->
    </div>

    <!-- Sell Button -->
    <button class="sell-btn" id="sellBtn">
        <span class="sell-icon">➕</span>
        Sell Your Product
    </button>
</div>
