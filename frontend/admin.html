<!-- Admin Page -->
<div class="admin-container">
    <!-- Admin Tabs -->
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="admin-tab" data-tab="users">👥 Users</button>
        <button class="admin-tab" data-tab="creators">⭐ Creators</button>
        <button class="admin-tab" data-tab="products">🛒 Products</button>
        <button class="admin-tab" data-tab="videos">🎬 Videos</button>
        <button class="admin-tab" data-tab="jobs">💼 Jobs</button>
        <button class="admin-tab" data-tab="courses">📚 Courses</button>
        <button class="admin-tab" data-tab="withdrawals">💰 Withdrawals</button>
        <button class="admin-tab" data-tab="reports">📋 Reports</button>
        <button class="admin-tab" data-tab="notifications">🔔 Notifications</button>
        <button class="admin-tab" data-tab="ads">📺 Ads</button>
    </div>

    <!-- Dashboard -->
    <div class="admin-dashboard" id="adminDashboard">
        <div class="stats-grid">
            <div class="stat-card glass">
                <span class="stat-number" id="totalUsers">0</span>
                <span class="stat-label">Total Users</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="onlineUsers">0</span>
                <span class="stat-label">Online Users</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalRevenue">$0</span>
                <span class="stat-label">Revenue</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalSales">0</span>
                <span class="stat-label">Sales</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalVideos">0</span>
                <span class="stat-label">Videos</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalProducts">0</span>
                <span class="stat-label">Products</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalJobs">0</span>
                <span class="stat-label">Jobs</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-number" id="totalCourses">0</span>
                <span class="stat-label">Courses</span>
            </div>
        </div>
    </div>
    </div>
