<!-- Create Page -->
<div class="create-container">
    <div class="create-header">
        <h2>✨ Create Something Amazing</h2>
        <p>Share your work and earn money</p>
    </div>

    <!-- Upload Types -->
    <div class="upload-grid">
        <button class="upload-btn" data-type="video">
            <span class="upload-icon">🎬</span>
            <span>Video</span>
        </button>
        <button class="upload-btn" data-type="photo">
            <span class="upload-icon">📸</span>
            <span>Photo</span>
        </button>
        <button class="upload-btn" data-type="prompt">
            <span class="upload-icon">🤖</span>
            <span>AI Prompt</span>
        </button>
        <button class="upload-btn" data-type="bot">
            <span class="upload-icon">🤖</span>
            <span>Telegram Bot</span>
        </button>
        <button class="upload-btn" data-type="website">
            <span class="upload-icon">🌐</span>
            <span>Website</span>
        </button>
        <button class="upload-btn" data-type="code">
            <span class="upload-icon">💻</span>
            <span>Source Code</span>
        </button>
        <button class="upload-btn" data-type="ebook">
            <span class="upload-icon">📖</span>
            <span>E-book</span>
        </button>
        <button class="upload-btn" data-type="course">
            <span class="upload-icon">📚</span>
            <span>Course</span>
        </button>
        <button class="upload-btn" data-type="template">
            <span class="upload-icon">🎨</span>
            <span>Template</span>
        </button>
        <button class="upload-btn" data-type="digital">
            <span class="upload-icon">💎</span>
            <span>Digital Product</span>
        </button>
    </div>

    <!-- Creator Analytics -->
    <div class="creator-analytics glass">
        <h3>📊 Your Analytics</h3>
        <div class="analytics-grid">
            <div class="analytics-item">
                <span class="analytics-value" id="creatorFollowers">0</span>
                <span class="analytics-label">Followers</span>
            </div>
            <div class="analytics-item">
                <span class="analytics-value" id="creatorViews">0</span>
                <span class="analytics-label">Views</span>
            </div>
            <div class="analytics-item">
                <span class="analytics-value" id="creatorSales">0</span>
                <span class="analytics-label">Sales</span>
            </div>
            <div class="analytics-item">
                <span class="analytics-value" id="creatorEarnings">$0</span>
                <span class="analytics-label">Earnings</span>
            </div>
        </div>
    </div>

    <!-- My Content -->
    <div class="my-content">
        <div class="section-header">
            <h3>📦 My Content</h3>
            <button class="manage-btn">Manage</button>
        </div>
        <div class="content-grid" id="myContent">
            <!-- Content loaded dynamically -->
        </div>
    </div>
</div>
