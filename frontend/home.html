<!-- Home Page -->
<div class="home-container">
    <!-- Welcome Section -->
    <div class="welcome-card glass">
        <div class="welcome-header">
            <div>
                <h2>Welcome back, <span id="welcomeUsername">User</span>!</h2>
                <p>Level <span id="homeLevel">1</span> · <span id="homeXP">0</span> XP</p>
            </div>
            <div class="daily-reward">
                <span>🎁</span>
                <span>Daily Reward</span>
                <button class="claim-btn" id="claimDaily">Claim</button>
            </div>
        </div>
        <div class="level-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="levelProgress" style="width:0%"></div>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-value" id="homeBalance">$0.00</span>
                <span class="stat-label">Wallet</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="homeFollowers">0</span>
                <span class="stat-label">Followers</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="homeEarnings">$0.00</span>
                <span class="stat-label">Earnings</span>
            </div>
        </div>
    </div>

    <!-- Quick Categories -->
    <div class="quick-categories">
        <button class="category-card" onclick="ALPHA.loadPage('videos')">
            <span>🎬</span>
            <span>Videos</span>
        </button>
        <button class="category-card" onclick="ALPHA.loadPage('marketplace')">
            <span>🛒</span>
            <span>Marketplace</span>
        </button>
        <button class="category-card" onclick="ALPHA.loadPage('freelance')">
            <span>💼</span>
            <span>Freelance</span>
        </button>
        <button class="category-card" onclick="ALPHA.loadPage('courses')">
            <span>📚</span>
            <span>Courses</span>
        </button>
        <button class="category-card" onclick="ALPHA.loadPage('ai-assistant')">
            <span>🤖</span>
            <span>AI Assistant</span>
        </button>
        <button class="category-card" onclick="ALPHA.loadPage('create')">
            <span>✨</span>
            <span>Create</span>
        </button>
    </div>

    <!-- Trending Videos -->
    <div class="section">
        <div class="section-header">
            <h3>🔥 Trending Videos</h3>
            <button class="view-all" onclick="ALPHA.loadPage('videos')">View All</button>
        </div>
        <div class="video-scroll" id="trendingVideos">
            <!-- Videos loaded dynamically -->
        </div>
    </div>

    <!-- Creator Spotlight -->
    <div class="section">
        <div class="section-header">
            <h3>⭐ Creator Spotlight</h3>
            <button class="view-all">View All</button>
        </div>
        <div class="creator-scroll" id="creatorSpotlight">
            <!-- Creators loaded dynamically -->
        </div>
    </div>

    <!-- Marketplace Picks -->
    <div class="section">
        <div class="section-header">
            <h3>🛒 Top Products</h3>
            <button class="view-all" onclick="ALPHA.loadPage('marketplace')">View All</button>
        </div>
        <div class="product-scroll" id="topProducts">
            <!-- Products loaded dynamically -->
        </div>
    </div>

    <!-- Announcements -->
    <div class="announcement glass">
        <span>📢</span>
        <div>
            <h4>New Feature!</h4>
            <p>AI Assistant is now available. Ask anything!</p>
        </div>
        <button onclick="ALPHA.loadPage('ai-assistant')">Try Now →</button>
    </div>
            </div>
